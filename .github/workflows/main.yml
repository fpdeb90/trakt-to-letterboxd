name: Trakt to Letterboxd Sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: 

jobs:
  esegui-script:
    runs-on: ubuntu-latest

    steps:
      - name: Clona il repository
        uses: actions/checkout@v4

      - name: Configura l'ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Esegui lo script
        env:
          LETTERBOXD_USERNAME: ${{ secrets.LETTERBOXD_USERNAME }}
          LETTERBOXD_PASSWORD: ${{ secrets.LETTERBOXD_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_API_KEY }}
        run: |
          python -m trakt_to_letterboxd
